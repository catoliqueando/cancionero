<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f8f3e8">
  <meta name="description" content="Cancionero parroquial Catoliqueando: cantos para acompañar la Santa Misa desde tu celular.">
  <meta name="site-version" content="__SITE_VERSION__">
  <title>Cancionero Catoliqueando</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css?v=__SITE_VERSION__">
  <script>
    (() => {
      const actual = "__SITE_VERSION__";
      if (actual.includes("__") || actual === "local") return;
      fetch(`version.json?t=${Date.now()}`, { cache: "no-store" })
        .then(respuesta => respuesta.ok ? respuesta.json() : null)
        .then(datos => {
          if (!datos?.version || datos.version === actual) return;
          const url = new URL(location.href);
          url.searchParams.set("version", datos.version);
          location.replace(url.toString());
        })
        .catch(() => {});
    })();
  </script>
</head>
<body>
  <a class="skip-link" href="#app">Ir al contenido principal</a>

  <header class="site-header">
    <a href="#/" class="brand" aria-label="Inicio">
      <img src="assets/encabezado-catoliqueando.png" alt="Catoliqueando - Cancionero Parroquial">
    </a>
  </header>

  <main id="app" class="app-shell" tabindex="-1"></main>

  <footer class="footer">
    <div class="footer-cross" aria-hidden="true">✝</div>
    <strong>Catoliqueando</strong>
    <span>FE • ESPERANZA • AMOR</span>
    <small>Conociendo, viviendo y compartiendo nuestra fe</small>
    <a class="footer-admin" href="admin-misa.html">Administrar Misa</a>
  </footer>

  <script src="cantos.js?v=__SITE_VERSION__"></script>
  <script src="app.js?v=__SITE_VERSION__"></script>
</body>
</html>
